<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAF7F1">
    <title>新生兒熊崎氏姓名學 - 智能擇名系統</title>
    <!-- 韓系文青風：字型（樣式全部在下方 <style>，不再依賴 Tailwind CDN） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ============ 韓系文青 · 設計變數 ============ */
        :root {
            --paper: #FAF7F1;
            --bg-primary: #F6F2E9;
            --bg-surface: #FFFDF8;
            --bg-glass: rgba(255, 253, 248, 0.88);
            --primary: #5F6F52;
            --primary-hover: #4E5C44;
            --primary-light: #EDF0E6;
            --accent-吉: #5F6F52;
            --accent-吉-bg: #EEF1E7;
            --accent-次吉: #5F6F52;
            --accent-次吉-bg: #EEF1E7;
            --text-main: #2F2B26;
            --text-soft: #6B6252;
            --text-muted: #93897B;
            --border: #E7E1D4;
            --border-soft: #EFE9DB;
            --radius-lg: 24px;
            --radius-md: 14px;
            --shadow-sm: 0 2px 10px rgba(93, 85, 70, 0.05);
            --shadow-md: 0 18px 40px -18px rgba(93, 85, 70, 0.18);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        html {
            -webkit-text-size-adjust: 100%;
            scrollbar-gutter: stable;
        }
        /* Modal 開啟時鎖定背景捲動（由 JS 切換 class） */
        html.modal-open { overflow: hidden; }

        ::selection { background: rgba(138, 154, 125, 0.28); }

        body {
            background: var(--paper);
            background-image:
                radial-gradient(55% 45% at 8% 0%, rgba(138, 154, 125, 0.13) 0%, transparent 60%),
                radial-gradient(45% 40% at 96% 12%, rgba(201, 155, 142, 0.11) 0%, transparent 60%),
                radial-gradient(60% 50% at 50% 105%, rgba(216, 207, 186, 0.3) 0%, transparent 65%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 3.5rem 1.25rem 4.5rem;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* ============ 頁首 ============ */
        header { text-align: center; margin-bottom: 2.75rem; }

        .eyebrow {
            font-family: "Cormorant Garamond", "Noto Serif TC", serif;
            font-size: 0.78rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #A79A80;
            margin-bottom: 1rem;
        }

        header h1 {
            font-family: "Noto Serif TC", "PingFang TC", serif;
            font-size: clamp(1.9rem, 1.1rem + 3.2vw, 2.9rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .tagline { color: var(--text-muted); font-size: 0.98rem; letter-spacing: 0.05em; }

        .hero-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            margin-top: 1.5rem;
            color: #B7AA8C;
            font-size: 0.75rem;
        }
        .hero-divider::before,
        .hero-divider::after { content: ""; height: 1px; width: 72px; }
        .hero-divider::before { background: linear-gradient(90deg, transparent, #CFC5AC); }
        .hero-divider::after { background: linear-gradient(90deg, #CFC5AC, transparent); }

        /* ============ 搜尋卡片 ============ */
        .search-card {
            position: relative;
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.4rem 2.1rem 2.1rem;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .search-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent 4%, #A8B694 30%, #C99B8E 70%, transparent 96%);
            opacity: 0.65;
        }

        .input-group { display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: flex-end; }
        .field { flex: 1; min-width: 220px; }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            color: var(--text-soft);
            margin-bottom: 0.6rem;
        }
        .field label::before { content: "·"; color: #A8B694; margin-right: 0.5em; }

        input[type="text"], input[type="number"] {
            width: 100%;
            height: 50px;
            padding: 0 1.15rem;
            border: 1px solid #E3DCCB;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            background: #FFFEFB;
            transition: var(--transition);
            outline: none;
        }
        input::placeholder { color: #BCB2A0; }
        input:focus {
            border-color: #8A9A7D;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(138, 154, 125, 0.16);
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .btn-submit {
            background: #38332B;
            color: #F7F3EA;
            border: none;
            padding: 0 2.5rem;
            height: 50px;
            border-radius: 999px;
            font-family: "Noto Serif TC", serif;
            font-weight: 600;
            font-size: 0.98rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 12px 26px -12px rgba(56, 51, 43, 0.5);
        }
        .btn-submit:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 16px 30px -12px rgba(95, 111, 82, 0.5);
        }
        .btn-submit:active { transform: translateY(0); }

        .info-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.25rem 0;
            background: #F5F0E3;
            border: 1px solid #EBE3D0;
            border-radius: 14px;
            margin-top: 1.6rem;
            padding: 0.95rem 1.5rem;
            font-size: 0.9rem;
            color: var(--text-soft);
        }
        .info-bar strong {
            color: var(--text-main);
            font-weight: 700;
            font-family: "Noto Serif TC", serif;
        }
        .info-bar span + span::before { content: "·"; color: #BDB193; margin: 0 1rem; }

        /* ============ 結果區 ============ */
        .results-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 2.75rem 0 1.5rem; }
        .results-head h2 {
            font-family: "Noto Serif TC", serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            position: relative;
            padding-left: 1.05rem;
        }
        .results-head h2::before {
            content: "";
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 1.05em;
            border-radius: 999px;
            background: linear-gradient(180deg, #A8B694, #8A9A7D);
        }
        .results-head .en {
            font-family: "Cormorant Garamond", serif;
            font-size: 0.72rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #A79A80;
        }

        .grid-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
            gap: 1.4rem;
        }

        .tier-divider {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.25rem 0;
        }
        .tier-divider::before,
        .tier-divider::after {
            content: "";
            flex: 1;
            height: 1px;
        }
        .tier-divider::before { background: linear-gradient(90deg, transparent, #D8CFBA); }
        .tier-divider::after { background: linear-gradient(90deg, #D8CFBA, transparent); }
        .tier-divider span {
            font-family: "Noto Serif TC", serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            color: var(--accent-次吉);
            white-space: nowrap;
        }

        .config-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem 1.5rem 1.3rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.1rem;
        }
        .config-card:hover {
            transform: translateY(-4px);
            border-color: #C9CFB4;
            box-shadow: 0 26px 48px -22px rgba(93, 85, 70, 0.28);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            border-bottom: 1px dashed #E2DBC9;
            padding-bottom: 1rem;
            margin-bottom: 1.1rem;
        }

        .stroke-combo {
            font-family: "Noto Serif TC", serif;
            font-size: 1.18rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #33302A;
            white-space: nowrap;
        }

        .badge {
            padding: 0.28rem 0.85rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .badge-吉 { background: var(--accent-吉-bg); color: var(--accent-吉); border-color: #D9DFC9; }
        .badge-次吉 { background: var(--accent-次吉-bg); color: var(--accent-次吉); border-color: #EBD9CF; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
            font-size: 0.85rem;
            margin-bottom: 1.1rem;
        }
        .stat-item {
            background: var(--bg-primary);
            border: 1px solid #ECE5D4;
            padding: 0.55rem 0.85rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-soft);
        }
        .stat-item strong { color: var(--primary); font-weight: 700; font-family: "Noto Serif TC", serif; }

        .interactive-strokes { display: flex; gap: 0.6rem; }
        .btn-stroke {
            flex: 1;
            background: #F0F3E8;
            color: #4E5C44;
            border: 1px solid #DCE2CC;
            padding: 0.62rem 0.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.84rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }
        .btn-stroke:hover {
            background: #E4E9D6;
            border-color: #B9C49E;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px -10px rgba(95, 111, 82, 0.45);
        }

        .candidate-box {
            background: #FAF7EE;
            border: 1px dashed #DFD6BF;
            border-radius: 14px;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
        }
        .candidate-title { color: var(--text-muted); font-size: 0.72rem; letter-spacing: 0.12em; margin-bottom: 0.45rem; }
        .candidate-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 26px; }
        .candidate-tags > div { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
        .char-tag {
            background: #FFFDF8;
            border: 1px solid #E4DCCA;
            padding: 0.05rem 0.65rem;
            border-radius: 999px;
            font-family: "Noto Serif TC", serif;
            font-weight: 600;
            font-size: 0.92rem;
            color: #3A352D;
        }

        /* ============ Modal ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(47, 43, 38, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #FFFEFA;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 80px -24px rgba(47, 43, 38, 0.4);
            animation: modalUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes modalUp {
            from { transform: translateY(24px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 1.15rem 1.5rem;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-family: "Noto Serif TC", serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; }
        .modal-close-x {
            display: grid;
            place-items: center;
            width: 44px; height: 44px;
            margin: -6px;
            flex-shrink: 0;
            border: none;
            background: transparent;
            border-radius: 999px;
            font-size: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-close-x:hover { background: #F1EBDD; color: var(--text-main); }
        .modal-close-x:focus-visible { outline: 2px solid #8A9A7D; outline-offset: 2px; }

        /* 底部抽屜的拖曳把手（僅手機顯示） */
        .modal-grab {
            display: none;
            width: 44px; height: 5px;
            border-radius: 999px;
            background: #E0D8C4;
            margin: 0.6rem auto 0;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 1.4rem 1.5rem;
            overflow-y: auto;
            overscroll-behavior: contain; /* 防止慣性捲動把背景頁面一起帶走 */
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-track { background: transparent; }
        .modal-body::-webkit-scrollbar-thumb { background: #DED5BE; border-radius: 999px; }

        .selectable-char {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #E4DCCA;
            border-radius: 12px;
            background: #FFFEFB;
            font-family: "Noto Serif TC", serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #3A352D;
            cursor: pointer;
            transition: var(--transition);
        }
        .selectable-char:hover {
            border-color: #8A9A7D;
            color: #4E5C44;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px -8px rgba(93, 85, 70, 0.35);
        }
        .selectable-char.selected {
            background: var(--primary);
            color: #F7F4EA;
            border-color: var(--primary);
            box-shadow: 0 8px 18px -8px rgba(95, 111, 82, 0.55);
        }

        /* 候選清單 Big5 常用字與生僻字的分界線 (flex-wrap 容器,故用 width:100%) */
        .char-split-divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.35rem 0;
        }
        .char-split-divider::before,
        .char-split-divider::after {
            content: "";
            flex: 1;
            height: 1px;
        }
        .char-split-divider::before { background: linear-gradient(90deg, transparent, #DED5BE); }
        .char-split-divider::after { background: linear-gradient(90deg, #DED5BE, transparent); }
        .char-split-divider span {
            font-family: "Noto Serif TC", serif;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            color: #A89F8C;
            white-space: nowrap;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: flex-end;
        }

        .btn-close {
            background: #38332B;
            color: #F7F3EA;
            border: none;
            padding: 0.6rem 1.9rem;
            border-radius: 999px;
            font-family: "Noto Serif TC", serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-close:hover { background: var(--primary); }

        /* ============ 頁尾 ============ */
        .site-footer {
            margin-top: 3.5rem;
            text-align: center;
            color: #A79A80;
            font-size: 0.78rem;
            letter-spacing: 0.28em;
        }

        /* ============ 鍵盤焦點 ============ */
        .btn-submit:focus-visible,
        .btn-stroke:focus-visible,
        .btn-close:focus-visible {
            outline: 2px solid #8A9A7D;
            outline-offset: 2px;
        }

        /* ============ v2 · 動態系統與細節精修 ============ */

        /* --- 環境背景：放射漸層移到偽元素上緩慢漂移 --- */
        body { background-image: none; }
        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(55% 45% at 8% 0%, rgba(138, 154, 125, 0.16) 0%, transparent 60%),
                radial-gradient(45% 40% at 96% 12%, rgba(201, 155, 142, 0.14) 0%, transparent 60%),
                radial-gradient(60% 50% at 50% 105%, rgba(216, 207, 186, 0.38) 0%, transparent 65%);
            animation: bgDrift 26s ease-in-out infinite alternate;
        }
        @keyframes bgDrift {
            from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
            to { transform: translate3d(1.5%, 1.5%, 0) scale(1.06); }
        }

        /* --- Keyframes --- */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        @keyframes liftIn { from { opacity: 0; transform: translateY(22px) scale(0.99); } to { opacity: 1; transform: none; } }
        @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: none; } }
        @keyframes charIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes charPop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
        @keyframes tagIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes dividerIn { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
        @keyframes infoFlash { from { background: #EDE5CF; } to { background: #F5F0E3; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalDown { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(18px) scale(0.98); } }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes sheetDown { from { transform: translateY(0); } to { transform: translateY(100%); } }

        /* --- 載入：頁首逐行浮現 + 搜尋卡入場 --- */
        .stagger-item { animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: var(--d, 0ms); }
        .search-card { animation: liftIn 0.7s 0.15s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
        .results-head { animation: fadeUp 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

        /* --- 結果卡片：計算時層疊入場，捲動時依序揭示（動畫結束後不影響 hover） --- */
        .config-card { opacity: 0; }
        .config-card.in {
            opacity: 1;
            animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            animation-delay: var(--d, 0ms);
        }
        .config-card.in:hover {
            transform: translateY(-4px);
            border-color: #C9CFB4;
            box-shadow: 0 26px 48px -22px rgba(93, 85, 70, 0.28);
        }

        /* --- 層級分隔線入場 --- */
        .tier-divider { animation: fadeIn 0.5s 0.1s backwards; }
        .tier-divider::before, .tier-divider::after { transform-origin: center; animation: dividerIn 0.7s 0.2s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
        .tier-divider span { animation: fadeUp 0.5s 0.25s backwards; }

        .results-count { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.08em; }

        /* --- Modal 進出場 + 字格層疊 + 選取彈跳 --- */
        .modal-overlay.active { animation: fadeIn 0.22s ease backwards; }
        .modal-overlay.closing { animation: fadeIn 0.18s ease reverse both; pointer-events: none; }
        .modal-overlay.closing .modal-card { animation: modalDown 0.18s ease both; }
        .selectable-char { animation: charIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: var(--d, 0ms); }
        .selectable-char.selected {
            animation: charIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards, charPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation-delay: var(--d, 0ms), 0ms;
        }

        /* --- Modal 過濾列 --- */

        /* --- 手機：拇指友善布局 + Modal 底部抽屜化 --- */
        @media (max-width: 768px) {

            .input-group { flex-direction: column; align-items: stretch; gap: 0.9rem; }

        /* --- 觸控裝置：效能優化 + 消除 hover 黏착 --- */

            /* 停用背景漸層無限漂移與 backdrop-filter，省電且避免捲動掉幀 */

        /* --- 無障礙：尊重系統「減少動態效果」設定 --- */
        @media (prefers-reduced-motion: reduce) {

    CHAR_DICT_SPLIT: {}

// 異步載入外部 JSON 字庫
async function loadCharData() {
    // 直接雙擊開啟 (file://) 時 Chrome/Edge 會擋住 fetch，
    // 因此若 data.js 已透過 <script> 載入字庫，優先使用它
    if (window.CHAR_DICT_DATA && Object.keys(window.CHAR_DICT_DATA).length > 0) {
        DATA.CHAR_DICT = window.CHAR_DICT_DATA;
        // data.js 同時提供各筆劃群 Big5 字數,供候選清單畫常用/生僻分隔線
        DATA.CHAR_DICT_SPLIT = window.CHAR_DICT_SPLIT || {};
        return;
    }
    try {
        const response = await fetch('./data.json');
        if (!response.ok) {
            throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
        }
        DATA.CHAR_DICT = await response.json();
    } catch (error) {
        console.error("無法載入 ./data.json 資料庫：", error);
    }
}

let currentConfigCandidates = {}; // 保存各筆劃組合選擇的候選字

// 五行換算 (尾數1,2木, 3,4火, 5,6土, 7,8金, 9,0水)
function getFiveElement(num) {
    const digit = num % 10;
    if (digit === 1 || digit === 2) return "木";
    if (digit === 3 || digit === 4) return "火";
    if (digit === 5 || digit === 6) return "土";
    if (digit === 7 || digit === 8) return "金";
    return "水";
}

// 自動監聽姓氏輸入
document.getElementById("surnameInput").addEventListener("input", function(e) {
    const val = e.target.value.trim();
    if (DATA.SURNAME_DICT[val]) {
        document.getElementById("strokeInput").value = DATA.SURNAME_DICT[val];
    }
});

// 使用者開始修正輸入時，立即清除錯誤提示
["surnameInput", "strokeInput"].forEach(id =>
    document.getElementById(id).addEventListener("input", clearFieldError)
);

function showFieldError(msg) {
    const el = document.getElementById("fieldError");
    el.textContent = msg;
    el.classList.add("show");
    // 手機上鍵盤常遮住輸入框下方，把錯誤提示捲入視窗
    el.scrollIntoView({ block: "nearest", behavior: "smooth" });
    const card = document.querySelector(".search-card");
    card.classList.remove("shake");
    void card.offsetWidth; // 重新觸發 shake 動畫
    card.classList.add("shake");
}

function clearFieldError() {
    document.getElementById("fieldError").classList.remove("show");
}

function calculateNameConfig(silent) {
    const surname = document.getElementById("surnameInput").value.trim();
    let S = parseInt(document.getElementById("strokeInput").value);

    if (!S && surname && DATA.SURNAME_DICT[surname]) {
        S = DATA.SURNAME_DICT[surname];
        document.getElementById("strokeInput").value = S;
    }

    if (!S || S <= 0) {
        // 首次載入頁面時尚未輸入，靜默跳過，不跳出警示視窗
        if (!silent) showFieldError("請輸入有效的姓氏或康熙筆劃數");
        return;
    }
    clearFieldError();

    const tianStroke = S + 1;
    const tianElement = getFiveElement(tianStroke);

    // 更新抬頭 UI
    document.getElementById("infoSurnameText").textContent = surname || "自訂";
    document.getElementById("infoStrokeText").textContent = S;
    document.getElementById("infoTianText").textContent = `${tianStroke} (${tianElement})`;
    const infoBar = document.getElementById("surnameInfo");
    infoBar.classList.remove("flash");
    void infoBar.offsetWidth; // 重新觸發 flash 動畫
    infoBar.classList.add("flash");

    const results = [];

    // 遍歷名字第一字(N1)與第二字(N2) 筆劃 (從 1 到 25 劃)
    for (let n1 = 1; n1 <= 25; n1++) {
        for (let n2 = 1; n2 <= 25; n2++) {
            const ren = S + n1;
            const di = n1 + n2;
            const wai = n2 + 1;
            const zong = S + n1 + n2;

            const renLuck = DATA.STROKES_LUCK[ren]?.type || "";
            const diLuck = DATA.STROKES_LUCK[di]?.type || "";
            const waiLuck = DATA.STROKES_LUCK[wai]?.type || "";
            const zongLuck = DATA.STROKES_LUCK[zong]?.type || "";

            // 嚴格篩選：人、地、外、總格都必須帶「吉」
            if (renLuck=="吉" && diLuck=="吉" && waiLuck=="吉" && zongLuck=="吉") {
                const renElement = getFiveElement(ren);
                const diElement = getFiveElement(di);
                const sanCaiKey = tianElement + renElement + diElement;
                const sanCaiLuck = DATA.SAN_CAI_LUCK[sanCaiKey];

                // 三才配置大吉或次吉
                if (sanCaiLuck === "吉" || sanCaiLuck === "次吉") {
                    results.push({
                        n1, n2, ren, di, wai, zong,
                        renElement, diElement,
                        sanCaiKey, sanCaiLuck,
                        renLuck, diLuck, waiLuck, zongLuck
                    });
                }
            }
        }
    }

    renderResults(S, results);
}

function renderResults(surnameStroke, list) {
    const container = document.getElementById("resultsContainer");
    container.innerHTML = "";
    document.getElementById("resultCount").textContent = list.length > 0 ? `共 ${list.length} 個配置` : "";

    if (list.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">✦</div>
                <div class="empty-title">未找到完全符合的配置</div>
                <div class="empty-sub">建議調整姓氏或筆劃後再試。</div>
            </div>`;
        return;
    }

    // 分組渲染：三才吉群在上、分隔線、三才次吉群在下
    const jiList = list.filter(item => item.sanCaiLuck === "吉");
    const ciList = list.filter(item => item.sanCaiLuck === "次吉");

    let cardIndex = 0;

    const renderCard = (item) => {
        const configId = `${surnameStroke}_${item.n1}_${item.n2}`;
        if (!currentConfigCandidates[configId]) {
            currentConfigCandidates[configId] = { n1: [], n2: [] };
        }

        const card = document.createElement("div");
        card.className = "config-card";
        // 層疊延遲設上限，長清單的後段卡片不必等太久
        card.style.setProperty("--d", `${Math.min(cardIndex++, 12) * 45}ms`);
        card.innerHTML = `
            <div>
                <div class="card-header">
                    <div class="stroke-combo">配置 (${surnameStroke}, ${item.n1}, ${item.n2})</div>
                    <span class="badge badge-${item.sanCaiLuck}">三才${item.sanCaiLuck} (${item.sanCaiKey})</span>
                </div>
                <div class="stat-grid">
                    <div class="stat-item"><span>人格: ${item.ren}劃</span> <strong>${item.renLuck}</strong></div>
                    <div class="stat-item"><span>地格: ${item.di}劃</span> <strong>${item.diLuck}</strong></div>
                    <div class="stat-item"><span>外格: ${item.wai}劃</span> <strong>${item.waiLuck}</strong></div>
                    <div class="stat-item"><span>總格: ${item.zong}劃</span> <strong>${item.zongLuck}</strong></div>
                </div>
                <div class="interactive-strokes">
                    <button class="btn-stroke" onclick="openCharModal('${configId}', 'n1', ${item.n1})">名首字：${item.n1} 劃 🔍</button>
                    <button class="btn-stroke" onclick="openCharModal('${configId}', 'n2', ${item.n2})">名尾字：${item.n2} 劃 🔍</button>
                </div>
            </div>
            <div class="candidate-box">
                <div class="candidate-title">候選名單預覽：</div>
                <div class="candidate-tags" id="cand_${configId}">
                    ${renderCandidateTags(configId)}
                </div>
            </div>
        `;
        container.appendChild(card);
    };

    jiList.forEach(renderCard);

    // 兩群皆存在時才插入分隔線
    if (jiList.length > 0 && ciList.length > 0) {
        const divider = document.createElement("div");
        divider.className = "tier-divider";
        divider.innerHTML = "<span>三才次吉</span>";
        container.appendChild(divider);
    }

    ciList.forEach(renderCard);

    // 視窗內的卡片層疊入場；視窗外的卡片捲動到才揭示
    container.querySelectorAll(".config-card").forEach(card => {
        if (card.getBoundingClientRect().top < window.innerHeight) {
            card.classList.add("in");
        } else {
            card.style.setProperty("--d", "0ms");
            revealObserver.observe(card);
        }
    });
}

// 捲動揭示觀察器
const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("in");
            revealObserver.unobserve(entry.target);
        }
    });
}, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });

function renderCandidateTags(configId) {
    const data = currentConfigCandidates[configId];
    if (!data || (data.n1.length === 0 && data.n2.length === 0)) {
        return `<span style="color:#a1a1aa; font-size:0.8rem;">點擊上方筆劃選擇吉字...</span>`;
    }
    let html = "";
    const tag = (c, i) => `<span class="char-tag" style="--d:${Math.min(i, 8) * 35}ms">${c}</span>`;
    if (data.n1.length > 0) html += `<div>首字: ${data.n1.map(tag).join("")}</div>`;
    if (data.n2.length > 0) html += `<div style="margin-top:2px;">尾字: ${data.n2.map(tag).join("")}</div>`;
    return html;
}

// Modal 控制邏輯
let activeContext = null;
let activeChars = [];
let lastFocusedEl = null; // 開啟前持有焦點的元件，關閉後歸還

function openCharModal(configId, pos, stroke) {
    activeContext = { configId, pos, stroke };
    document.getElementById("modalTitle").textContent = `選擇 ${stroke} 筆劃吉字`;
    
    // 相容數字與字串格式 Key，若找不到則回傳空陣列
    activeChars = DATA.CHAR_DICT[stroke] || DATA.CHAR_DICT[String(stroke)] || [];
    const selectedList = currentConfigCandidates[configId][pos];

    // 重置過濾狀態
    document.getElementById("charFilterInput").value = "";
    document.getElementById("charCount").textContent = activeChars.length ? `${activeChars.length} 字` : "";
    
    const grid = document.getElementById("modalCharGrid");
    grid.innerHTML = "";

    if (activeChars.length === 0) {
        grid.innerHTML = `<div style="color:var(--text-muted); padding:1rem;">查無此筆劃 (${stroke} 劃) 的字庫資料。</div>`;
    } else {
        // Big5 常用字 / 生僻字 分界(由 data.js 的 CHAR_DICT_SPLIT 提供;
        // fetch 回退路徑沒有分界資訊時 split=0,不畫分隔線,但字序仍為常用在前)
        const split = Number(DATA.CHAR_DICT_SPLIT[stroke] ?? 0);
        activeChars.forEach((char, i) => {
            const charEl = document.createElement("div");
            const isSelected = selectedList.includes(char);
            charEl.className = `selectable-char ${isSelected ? 'selected' : ''}`;
            charEl.style.setProperty("--d", `${Math.min(i, 23) * 18}ms`);
            charEl.textContent = char;
            charEl.onclick = () => {
                charEl.classList.toggle("selected");
                if (charEl.classList.contains("selected")) {
                    currentConfigCandidates[configId][pos].push(char);
                } else {
                    currentConfigCandidates[configId][pos] = currentConfigCandidates[configId][pos].filter(c => c !== char);
                }
                // 即時更新背後的候選預覽
                document.getElementById(`cand_${configId}`).innerHTML = renderCandidateTags(configId);
            };
            grid.appendChild(charEl);
            // 在最後一個 Big5 常用字之後、生僻字之前插入分界線
            if (i === split - 1 && split > 0 && split < activeChars.length) {
                const divider = document.createElement("div");
                divider.className = "char-split-divider";
                divider.innerHTML = "<span>少用・生僻字(部分裝置可能無法顯示)</span>";
                grid.appendChild(divider);
            }
        });
    }

    const overlay = document.getElementById("charModal");
    lastFocusedEl = document.activeElement;
    overlay.classList.add("active");
    document.documentElement.classList.add("modal-open"); // 鎖定背景捲動
    overlay.querySelector(".modal-close-x").focus({ preventScroll: true });
}

function closeModal() {
    const overlay = document.getElementById("charModal");
    if (!overlay.classList.contains("active")) return;
    overlay.classList.add("closing");
    document.documentElement.classList.remove("modal-open"); // 解鎖背景捲動
    setTimeout(() => {
        overlay.classList.remove("active", "closing");
        // 焦點歸還給開啟它的按鈕，方便鍵盤使用者繼續操作
        if (lastFocusedEl && typeof lastFocusedEl.focus === "function") {
            lastFocusedEl.focus({ preventScroll: true });
        }
        lastFocusedEl = null;
    }, 180);
}

// 字格過濾
function filterCharGrid() {
    if (!activeContext) return;
    const q = document.getElementById("charFilterInput").value.trim();
    const grid = document.getElementById("modalCharGrid");
    const items = [...grid.querySelectorAll(".selectable-char")];
    let visible = 0;
    items.forEach(el => {
        const show = !q || el.textContent.includes(q);
        el.style.display = show ? "" : "none";
        if (show) visible++;
    });
    document.getElementById("charCount").textContent = q ? `${visible} / ${activeChars.length} 字` : `${activeChars.length} 字`;

    let emptyMsg = grid.querySelector(".filter-empty");
    if (visible === 0) {
        if (!emptyMsg) {
            emptyMsg = document.createElement("div");
            emptyMsg.className = "filter-empty";
            emptyMsg.style.cssText = "color:var(--text-muted); padding:1rem; width:100%;";
            grid.appendChild(emptyMsg);
        }
        emptyMsg.style.display = "";
        emptyMsg.textContent = "沒有符合的字";
    } else if (emptyMsg) {
        emptyMsg.style.display = "none";
    }
}

// Esc 鍵 / 點擊遮罩關閉
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
document.getElementById("charModal").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeModal();
});

// 手機：底部抽屜下滑關閉（字格清單捲到最上時才生效，避免與清單捲動衝突）
(function initModalSwipeToClose() {
    if (!("ontouchstart" in window)) return;
    const overlay = document.getElementById("charModal");
    const card = overlay.querySelector(".modal-card");
    const grid = document.getElementById("modalCharGrid");
    let startY = 0, dragging = false, dist = 0;

    card.addEventListener("touchstart", e => {
        if (window.innerWidth > 768) return; // 桌面仍是置中對話框，不啟用拖曳
        if (grid.scrollTop > 4) return;      // 清單還沒捲到頂 → 讓觸控優先捲動清單
        startY = e.touches[0].clientY;
        dragging = true;
        dist = 0;
        card.style.transition = "none";
    }, { passive: true });

    card.addEventListener("touchmove", e => {
        if (!dragging) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) return;
        dist = dy > 120 ? 120 + (dy - 120) * 0.3 : dy; // 超過 120px 後加橡皮筋阻力
        card.style.transform = `translateY(${dist}px)`;
    }, { passive: true });

    const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        card.style.transition = "transform 0.2s cubic-bezier(0.22, 1, 0.36, 1)";
        if (dist > 90) {
            card.style.transform = "translateY(100%)";
            setTimeout(() => { card.style.transform = ""; card.style.transition = ""; }, 200);
            closeModal();
        } else {
            card.style.transform = "";
            setTimeout(() => { card.style.transition = ""; }, 220);
        }
    };
    card.addEventListener("touchend", endDrag);
    card.addEventListener("touchcancel", endDrag);
})();

// 頁面初次載入時先下載 JSON 再執行計算
window.onload = async function() {
    await loadCharData();
    if (!document.getElementById("surnameInput").value && !document.getElementById("strokeInput").value) {
        // 首次進入且尚未輸入：顯示引導提示，而非空白結果區
        document.getElementById("resultsContainer").innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">✦</div>
                <div class="empty-title">準備好了嗎？</div>
                <div class="empty-sub">輸入姓氏或康熙筆劃，按「計算最佳配置」開始擇名。</div>
            </div>`;
    } else {
        calculateNameConfig(true);
    }
};
